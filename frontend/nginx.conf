# ==========================================================
#  Uber Data Platform — SPA host
#  Serves the Vite production bundle and acts as an optional
#  same-origin reverse proxy for the Express API.
# ==========================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Compression ------------------------------------------------------
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_comp_level  6;
    gzip_types       text/plain
                     text/css
                     text/javascript
                     application/javascript
                     application/json
                     application/xml
                     image/svg+xml;

    # --- Security headers -------------------------------------------------
    # NOTE: `add_header` is inherited by a location block ONLY if that block
    # declares no `add_header` of its own. Cache control below therefore uses
    # `expires` rather than `add_header`, so these three stay in effect
    # everywhere.
    add_header X-Content-Type-Options "nosniff"                    always;
    add_header X-Frame-Options        "SAMEORIGIN"                 always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # --- Vite build assets ------------------------------------------------
    # Filenames are content-hashed, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # --- Reverse proxy: /api/* -> backend:5000 ----------------------------
    # Lets the SPA run same-origin (build with VITE_API_BASE_URL=/), which
    # removes CORS from the picture. Harmless when the SPA talks to :5000
    # directly instead.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- SPA fallback -----------------------------------------------------
    # react-router owns client-side routing, so unknown paths must return
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- The shell must never be cached -----------------------------------
    # `expires -1` emits Cache-Control: no-cache, or clients would pin an
    # old bundle reference after a redeploy.
    location = /index.html {
        expires -1;
    }

    # --- Silence favicon noise in the access log --------------------------
    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }
}
